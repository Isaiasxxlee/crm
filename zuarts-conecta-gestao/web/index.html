<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZUARTS SISTEMA DE GESTÃO</title>
    <meta name="description" content="ZUARTS Sistema de Gestão para gestão empresarial." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 320 320" role="img" aria-label="Zuarts Inova Simples">
            <defs>
              <linearGradient id="zuarts-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#2b6fe8" />
                <stop offset="100%" stopColor="#0b2e86" />
              </linearGradient>
              <linearGradient id="zuarts-green" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#b8e41a" />
                <stop offset="100%" stopColor="#91cd00" />
              </linearGradient>
            </defs>
            <path d="M70 30H250L210 70H70Z" fill="url(#zuarts-blue)" />
            <path d="M250 30V88L184 154L150 120L190 80L170 60H250Z" fill="url(#zuarts-blue)" />
            <path d="M70 290H250V230H118L70 178Z" fill="url(#zuarts-blue)" />
            <path d="M70 290V218L118 170L152 204L112 244L132 264H70Z" fill="url(#zuarts-blue)" />
            <path
              d="M76 122H160L194 156H244"
              fill="none"
              stroke="url(#zuarts-green)"
              stroke-width="14"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M56 160H142L176 194H222"
              fill="none"
              stroke="url(#zuarts-green)"
              stroke-width="14"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="72" cy="122" r="18" fill="#e4f95b" stroke="#8fc900" stroke-width="10" />
            <circle cx="244" cy="156" r="18" fill="#e4f95b" stroke="#8fc900" stroke-width="10" />
            <circle cx="56" cy="160" r="18" fill="#e4f95b" stroke="#8fc900" stroke-width="10" />
            <circle cx="222" cy="194" r="18" fill="#e4f95b" stroke="#8fc900" stroke-width="10" />
          </svg>
          <div class="brand-copy">
            <p class="eyebrow">ZUARTS SISTEMA DE GESTÃO</p>
            <h1>Zuarts Inova Simples.</h1>
            <p class="lead">Base responsiva com identidade própria, preparada para crescer como web app e PWA.</p>
          </div>
        </div>

        <div id="auth-view" class="panel">
          <form id="sign-in-form" class="form">
            <h2>Entrar</h2>
            <label>Email<input id="sign-in-email" type="email" autocomplete="email" required /></label>
            <label>Senha<input id="sign-in-password" type="password" autocomplete="current-password" required /></label>
            <button type="submit">Entrar</button>
            <p class="switch">Não tem conta? <a href="#" id="to-sign-up">Cadastre-se</a></p>
          </form>

          <form id="sign-up-form" class="form" hidden>
            <h2>Criar conta</h2>
            <label>Nome<input id="sign-up-name" type="text" autocomplete="name" required /></label>
            <label>Email<input id="sign-up-email" type="email" autocomplete="email" required /></label>
            <label>Senha<input id="sign-up-password" type="password" autocomplete="new-password" required /></label>
            <label>Empresa<input id="sign-up-company" type="text" placeholder="Minha Empresa" /></label>
            <button type="submit">Criar conta</button>
            <p class="switch">Já tem conta? <a href="#" id="to-sign-in">Entrar</a></p>
          </form>

          <p id="auth-message" class="message" role="status"></p>
        </div>

        <div id="app-view" class="panel" hidden>
          <h2>Sessão ativa</h2>
          <dl class="facts">
            <div><dt>Usuário</dt><dd id="me-name"></dd></div>
            <div><dt>Email</dt><dd id="me-email"></dd></div>
            <div><dt>Empresa</dt><dd id="me-company"></dd></div>
            <div><dt>Função</dt><dd id="me-role"></dd></div>
          </dl>
          <button id="sign-out" class="secondary">Sair</button>
          <p id="app-message" class="message" role="status"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
