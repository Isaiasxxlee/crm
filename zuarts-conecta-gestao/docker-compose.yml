services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zuarts_conecta
      POSTGRES_USER: zuarts
      POSTGRES_PASSWORD: zuarts
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuarts -d zuarts_conecta"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://zuarts:zuarts@db:5432/zuarts_conecta?schema=public
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
